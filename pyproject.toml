[project]
name = "multi-agent-ecommerce-rag"
version = "0.1.0"
description = "Reference project for a multi-agent e-commerce customer-support system"
readme = "README.md"
authors = [
    { name = "Harveen Kaur", email = "harveenkaur282@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.0",
    "botocore>=1.42.0",
    "cfn-lint>=1.61.0",
    "python-dotenv>=1.0.0",
    "strands-agents>=1.0.0",
]

[project.scripts]
multi-agent-ecommerce-rag = "multi_agent_ecommerce_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
